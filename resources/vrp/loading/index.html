<html>
	<head>
		<meta charset="UTF-8">
		<title></title>
		<script src="nui://game/ui/jquery.js"></script>
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
		<link href="css.css" rel="stylesheet" type="text/css"/>
	</head>
	<body>
		<div class="Teclas">
			<div class="teladiv">
				<div class="tecla1">P</div>
				<div class="tecla2">Pausar Musica</div>
			</div>
			<div class="teladiv">
				<div class="tecla1">W</div>
				<div class="tecla2">Aumentar Volume</div>
			</div>
			<div class="teladiv">
				<div class="tecla1">S</div>
				<div class="tecla2">Baixar Volume</div>
			</div>
		</div>
		<div class="custom-loader"></div>
		
		<i id="discord" class="fa-brands fa-discord" href="https://www.w3docs.com" target="_blank"></i>
		<i id="instagram" class="fa-brands fa-instagram"></i>
		<i id="tiktok" class="fa-brands fa-tiktok"></i>
		
		<audio id="music" autoplay>
			<source src="http://localhost/audio2.mp3" type="audio/mpeg">
		</audio>

		<script type="text/javascript">

			document.getElementById("discord").onclick = function () {
				location.href = "https://discord.gg/maui/";
			};

			document.getElementById("instagram").onclick = function () {
				location.href = "https://discord.gg/mauibeach/";
			};

			document.getElementById("tiktok").onclick = function () {
				location.href = "https://discord.gg/mauibeach/";
			};

			var music = document.getElementById("music");
			music.volume = 0.2;
			document.addEventListener("keypress",(event) => {

				
				if(event.key == "p"){
					if(music.paused){
						music.play();
					} else {
						music.pause();
					}
				}

				if(event.key == "s") {
					music.volume = music.volume-0.2;
				}else if(event.key == "w") {
					music.volume = music.volume+0.2;
				}

			});





		</script>

		<video autoplay muted loop>
			<source src="https://cdn.discordapp.com/attachments/1094703998394708061/1097643005474779306/INTRO60.mp4" type="video/mp4">
		</video>
	</body>
</html>
