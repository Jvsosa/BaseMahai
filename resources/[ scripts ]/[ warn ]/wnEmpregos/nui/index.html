<html>
	<head>
		<meta charset="UTF-8">
		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
		<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">    
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
		<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">    
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
		
		<link href="css.css" rel="stylesheet" type="text/css"/>
	</head>
	<body>
		<div class="container-fora">
			<div class="container">
				<div class="titlo"><i class="fa-duotone fa-briefcase fa-beat IconTitlo"></i>Emprego <ss id="emp"></ss></div>
	
				<div class="box-baixo">
					<div class="lado">
						<img class="img-aparecer" src="https://media.discordapp.net/attachments/913250396363972649/994083008116170823/gif_warn.gif" alt="">
						<div class="nome-personagem"><ss id="nome">Eduardo Sivla</ss> #<bb id="passaporte">1</bb></div>
						<div class="item-lado">
							<div class="lado1i"><ss style="margin-left: 5px;"><i class="fa-duotone fa-code IconitemInf"></i>Seu Level:</ss></div>
							<div class="lado2i"><ss style="margin-right: 15px;">Desativado</ss></div>
						</div>
						<div class="item-lado">
							<div class="lado1i"><ss style="margin-left: 5px;"><i class="fa-duotone fa-expand IconitemInf"></i>Seu Xp:</ss></div>
							<div class="lado2i"><ss style="margin-right: 15px;">Desativado</ss></div>
						</div>
						<div class="item-lado">
							<div class="lado1i"><ss style="margin-left: 5px;"><i class="fa-duotone fa-wallet IconitemInf"></i>Carteira:</ss></div>
							<div class="lado2i"><ss style="margin-right: 15px;" id="carteira">6.000 $</ss></div>
						</div>
						<div class="item-lado">
							<div class="lado1i"><ss style="margin-left: 5px;"><i class="fa-duotone fa-bank IconitemInf"></i>Banco:</ss></div>
							<div class="lado2i"><ss style="margin-right: 15px;" id="banco">1.200.000 $</ss></div>
						</div>
					</div>
					<div class="lado-direito">
						<div class="block"></div>
						<div class="infos-empregos-box">
							<div class="item-infos">
								<i class="fa-duotone fa-money-bill fa-beat IconInfos"></i>
								<div class="info-2">Salario</div>
								<div class="info-3" id="salario">80/110 $</div>
							</div>
							<div class="item-infos">
								<i class="fa-duotone fa-expand fa-beat IconInfos"></i>
								<div class="info-2">Xp por Blip</div>
								<div class="info-3">0 XP</div>
							</div>
							<div class="item-infos">
								<i class="fa-duotone fa-code fa-beat IconInfos"></i>
								<div class="info-2">Level Necessario</div>
								<div class="info-3">Desativado</div>
							</div>
						</div>
						<div class="box-nota">E necessario o level para conseguir iniciar.</div>
						<div class="iniciar" onclick="iniciar()">Iniciar</div>
					</div>
				</div>
			</div>
		</div>

		<div class="status">

			<div class="item-status">
				<i class="fa-duotone fa-map fa-beat IconInfos2"></i>
				<div class="info-2">Check</div>
				<div class="info-3" id="todosblips">0/5</div>
			</div>

			<div class="item-status">
				<i class="fa-duotone fa-money-bill fa-beat IconInfos2"></i>
				<div class="info-2">Ganho</div>
				<div class="info-3" id="ganho">0 $</div>
			</div>

		</div>

		<div class="f7request">
			<div class="IconF7"><i class="fas fa-times"></i></div>
			<div class="f72">Pressione <b>F7</b> para finalizar</div>
		</div>

		<script src="jquery.js" type="text/javascript"></script>
		<script src="chart.min.js" type="text/javascript"></script> 
	</body>
</html>
