<div class="hotbar-container">

</div>

<div class="backpack-container">

    <span class="backpack-subtext">System</span>

	<span class="backpack-bar-text">Aqui estao todos os seus itens.</span>

</div>

			<div class="inventory">
				<div class="invLeft">
				</div>
			</div>

			<div class="invMiddle">
				<input class="amount" placeholder="Quantidade" type="number" onKeyPress="if(this.value.length==9) return false;" maxlength="9" />
				<div class="use but">Usar</div>
				<div class="send but">Enviar</div>
				<div class="lixo but">Lixeira</div>
			</div>

			<div class="ladoEsquerdo">

				<div class="identidade-baixo">
					<div class="identidadeBlock" style="display: none;"></div>
					<img class="banner" src="https://cdn.discordapp.com/attachments/1094973674437750834/1101028283056926734/maui.png" alt="">
					<img class="imgperso" src="https://media.discordapp.net/attachments/913250396363972649/994083008116170823/gif_warn.gif" alt="">
					<div class="nomeperso"><ss id="nomeperso">Eduardo Silva</ss> #<ss id="passaporteslds" style="color: #EA7D57;">322</ss></div>
					<div class="empregoperso"><i class="fa-duotone fa-suitcase fa-beat"></i><ss id="cargoperso"></ss></div>

					<div class="identidadePart2" style="display: none;">

						<div class="item-identidade">
							<div class="barrinha"></div>
							<div class="infos-identidade"><span class="inf1"><i class="fa-regular fa-gem iconIdentidade"></i>Vip</span> <span class="inf2"><b id="vipPlayer">Maui</b></span></div>
						</div>

						<div class="item-identidade">
							<div class="barrinha"></div>
							<div class="infos-identidade"><span class="inf1"><i class="fa-regular fa-bank iconIdentidade"></i>Banco</span> <span class="inf2"><b id="bancoPlayer">8.839 $</b></span></div>
						</div>

						<div class="item-identidade">
							<div class="barrinha"></div>
							<div class="infos-identidade"><span class="inf1"><i class="fa-regular fa-phone iconIdentidade"></i>Telefone</span> <span class="inf2"><b id="telefonePlayer">999-999</b></span></div>
						</div>

						<div class="item-identidade">
							<div class="barrinha"></div>
							<div class="infos-identidade"><span class="inf1"><i class="fa-regular fa-glass-cheers iconIdentidade"></i>Tipo Sanguíneo</span> <span class="inf2"><b id="idadePlayer"></b></span></div>
						</div>

						<div class="item-identidade">
							<div class="barrinha"></div>
							<div class="infos-identidade"><span class="inf1"><i class="fa-regular fa-coins iconIdentidade"></i>Pérolas</span> <span class="inf2"><b id="perolasPlayer">120</b></span></div>

					</div>
