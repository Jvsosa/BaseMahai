	<script>
		$(document).ready(function(){
			let blocked = false
			let list = []

			window.addEventListener("message",function(event){
				switch(event.data.action){
					case 'notify':
						addNotification(event.data.data)
					break

					case 'showAll':
						if (list.length > 0){
							showLast()
							$.post("http://notifycall/focusOn")
						}
					break

					case 'hideAll':
						hideAll()
						$.post("http://notifycall/focusOff")
					break
				}
			});

			document.onkeyup = function(data){
				if (data.which == 27){
					hideAll()
					$.post("http://notifycall/focusOff")
				}
			};

			$(document).on("click","#loc",function(){
				$.post("http://notifycall/setWay",JSON.stringify({ x: $(this).attr("data-x"), y: $(this).attr("data-y") }))
			});

			$(document).on("click","#phone",function(){
				$.post("http://notifycall/phoneCall",JSON.stringify({ phone: $(this).attr("data-phone") }))
			});

			const hideAll = () => {
				blocked = false
				$(".body").css("overflow","hidden")
				$(".body").html("")
			};

			const addNotification = data => {
				if (list.length > 9) list.shift()

				const html = `<div class="notification" id="${data.imagem}">
					<div class="content">
						
							<div class="img-wrapper">
								<img class="img-notify" src="images/${data.imagem}.png" alt="">
							</div>
							<div class="text-wrapper">
								<div class="titulo">${data.title}</div>
								<div class="content-line">${data.criminal}</div>
							</div>
							<div class="buttons">
								<div class="chamados" id="loc" data-x="${data.x}" data-y="${data.y}"><i class="fas fa-map-marker-alt fa-lg"></i></div>
								<div class="horario">${data.time}</div>
							</div>
					</div>
				</div>`

				list.push(html)

				if (!blocked){
					$(html).prependTo(".body")
					.hide()
					.show("slide",{ direction: "right" },250)
					.delay(5000)
					.hide("slide",{ direction: "right" },250)
				}
			};

			const showLast = () => {
				hideAll()
				blocked = true

				$(".body").css("overflow-y","scroll")
				for (i in list){
					$(list[i]).prependTo(".body")
				}
			};
		});
	</script>
</html>
