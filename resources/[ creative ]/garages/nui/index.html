<html>
	<head>
		<meta charset="UTF-8">
		<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
		<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">    
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous"/>
		<link href="css.css" rel="stylesheet" type="text/css"/>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,700;1,800;1,900&family=Russo+One&display=swap" rel="stylesheet">
		<link rel="stylesheet" type="text/css" href="bibs/loading-bar.css" />
		<script type="text/javascript" src="bibs/loading-bar.js"></script>
		<link rel="stylesheet" href="https://pro.fontawesome.com/releases/v6.0.0-beta3/css/all.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
	</head>
	<body>

	<div class="container">
		<div class="title">Garagem</div>
		<div class="desc">Selecione um veiculo para o pegar</div>
		<div class="baixo">
			<div class="lado">
				<div class="search-bar">
					<i class="fa-duotone fa-magnifying-glass fa-flip"></i>
					<input class="inputprocurar" type="text" placeholder="Procurar..">
				</div>
				<div class="overflow-carros"></div>
			</div>
		</div>
	
		<div class="lado2" id="pagina-carro" style="display:none;"> 

			<div class="nome-carro-lado">Elegy</div>
			<div class="placa-carro-lado"><i class="fa-duotone fa-pen-to-square" onclick="trocarPlaca()"></i> <ss id="placa"></ss></div>

			<img class="img-carro-lado" src="https://media.discordapp.net/attachments/1019690118103179294/1099936998065709146/elegy.png" alt="">

			<div class="fechar-div">
				<div class="text-fechar">Fechar</div>
				<div class="bloco-fechar"  onclick="fecharNui()"><i class="fa-solid fa-times"></i></div>
			</div>

			<div class="text-estatiticas">Estatísticas</div>

			<div class="bars_div">
				<div class="bars motor">
					<div class="carBar" data-img="svgs/motor.svg"></div>
				</div>
				<div class="bars lataria">
					<div class="latariaBar" data-img="svgs/4_carro.svg"></div>
				</div>
				<div class="bars fuel">
					<div class="fuelBar" data-img="svgs/2_gas.svg"></div>
				</div>
			</div>

			<div class="botoes-lado">
				<div class="verbau" onclick="reqBau()"><i class="fa-duotone fa-treasure-chest"></i></div>
				<div class="botao2" onclick="retirarCarro()">RETIRAR</div>
				<div class="botao3" onclick="guardarCarro()">GUARDAR</div>
			</div>
		
		</div>

		<div class="lado2" id="pagina-bau">
			
			<div class="nome-carro-lado2">Elegy</div>
			<div class="placa-carro-lado2"><i class="fa-duotone fa-pen-to-square"></i> <ss id="placa2"></ss></div>
	
			<div class="box-itens"></div>
			
			<div class="fechar-div">
				<div class="text-fechar">Fechar</div>
				<div class="bloco-fechar"  onclick="fecharNui()"><i class="fa-solid fa-times"></i></div>
			</div>

		</div>

	</div>



	<script src="jquery.js" type="text/javascript"></script>

	
	</body>
</html>
